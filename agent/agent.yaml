# Агент на машине разработчика: yarn agent (порт API и токен регистрации — из .env.development).
# Узлы WireGuard — agent.prod.yaml поверх этого файла. Что получилось: yarn agent config check.
server:
  url: "http://localhost:${SERVER_PORT}"
  # API на этой машине — http://; на узлах — только https:// (или AGENT_SERVER_ALLOW_INSECURE).
  allowInsecure: true
enroll:
  token: "${AGENT_BOOTSTRAP_TOKEN}"
dataDir: ../.agent/data
labels:
  env: dev
# Здесь агент не обновляет себя по команде сервера: версию задаёт AGENT_VERSION (yarn agent).
update:
  mode: disabled
log:
  level: info
  # Какие записи журнала уходят на сервер без наблюдения; пока админку смотрят — подробнее.
  forward: warn
workers:
  # WireGuard-интерфейсы, IPIP-туннели, пробросы портов и пробы связности (настройки state и
  # probes, команда interface.restart). Здесь — имитация (WG_DRY_RUN=1): ни одной системной
  # команды, конфиги и состояние — в каталоге данных воркера (WORKER_STATE_DIR).
  - path: workers/wg
    env:
      WG_DRY_RUN: "1"
  # SOCKS5-прокси через mTLS (настройка proxies).
  - path: workers/socks
