# Агент на машине разработчика (agent/dev.sh): ${…} подставляет агент из окружения, которое
# готовит agent/dev.sh (адрес бэкенда, токен, каталог данных, имя, программы воркеров). На узлы
# этот файл не попадает: там настройки создаёт `agent install` (/etc/agent-wg/agent.yaml).
# Метка nodeId — из AGENT_NODE_ID (dev.sh передаёт её через AGENT_LABELS; пустой — без метки).
server:
  url: http://localhost:${SERVER_PORT}
dataDir: ${AGENT_DATA_DIR}
name: ${AGENT_NAME}
labels:
  env: dev
enroll:
  token: ${AGENT_BOOTSTRAP_TOKEN}
update:
  mode: disabled
log:
  level: info
  forward: warn
workers:
  # WireGuard, туннели, пробросы. WG_DRY_RUN=1 — имитация: ни одной системной команды,
  # конфиги для наглядности — в WG_CONFIG_DIR (на macOS — всегда).
  - name: wg
    command: ["${WG_WORKER_BIN}"]
    env:
      WG_DRY_RUN: "${WG_DRY_RUN}"
      WG_CONFIG_DIR: ${WG_CONFIG_DIR}
      WG_STATE_DIR: ${WG_STATE_DIR}
  # SOCKS5-прокси через mTLS: слушает порты из настройки proxies на этой машине.
  - name: socks
    command: ["${SOCKS_WORKER_BIN}"]
