# Узлы WireGuard: этот файл поверх agent.yaml (воркеры — оттуда же). Архив для узлов —
# yarn agent:pack (его же раздаёт API), установка — sudo ./agent install --env prod из архива или
# одной командой с API. Адрес API и токен узлу передаёт установка; свои значения — в .env
# (образец package/.env.example).
extends: agent.yaml
envFiles: [.env]
# Экземпляр агента проекта: служба agent-wg, /etc/agent-wg, /var/lib/agent-wg — рядом с агентами
# других бэкендов на том же узле.
instance: wg
install:
  # wg настраивает сам узел: интерфейсы, маршруты, iptables, sysctl.
  privileged: true
  packages: [wireguard-tools, iproute2, iptables, conntrack, iputils-ping]
  packagesByManager:
    dnf: [wireguard-tools, iproute, iptables, conntrack-tools, iputils]
    yum: [wireguard-tools, iproute, iptables, conntrack-tools, iputils]
    apk: [wireguard-tools, iproute2, iptables, conntrack-tools, iputils]
    zypper: [wireguard-tools, iproute2, iptables, conntrack-tools, iputils]
  sysctl:
    net.ipv4.ip_forward: "1"
    net.ipv6.conf.all.forwarding: "1"
# Файлы получателя в архиве (agent pack): Dockerfile, compose.yml, .env.example, README.md —
# в корень архива; agent.docker.yaml — настройки агента в контейнере.
pack:
  files: [package/, agent.docker.yaml]
server:
  url: "${AGENT_SERVER_URL}"
  # Только https:// (http:// — AGENT_SERVER_ALLOW_INSECURE=true в .env).
  allowInsecure: false
enroll:
  token: "${AGENT_ENROLL_TOKEN}"
labels:
  env: prod
update:
  mode: self
log:
  format: json
workers:
  # Настоящая система: конфиги wg-quick — /etc/wireguard (на Ubuntu AppArmor разрешает wg-quick
  # только его), что создал воркер — /var/lib/wg-admin (тот же каталог у всех версий воркера:
  # новая версия считает своими интерфейсы и туннели прежней).
  - path: workers/wg
    env:
      WG_DRY_RUN: "0"
      WG_CONFIG_DIR: /etc/wireguard
      WG_STATE_DIR: /var/lib/wg-admin
  - path: workers/socks
