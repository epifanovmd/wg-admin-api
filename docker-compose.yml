# Production-стек админки WireGuard: api + worker + одноразовый migrate, Redis;
# по профилю `https` — Caddy. Postgres — отдельным файлом
# (docker-compose.postgres.yml) или внешний. Агент WireGuard на нодах (в том
# числе на этом же VPS) — служба systemd (install.sh, см. agent/README.md).
# Образы — из registry или сборкой из исходников на хосте (`make release` /
# `make deploy`, см. Makefile).
#
#   docker compose build api           # или TAG=v1.2.3 docker compose pull
#   docker compose run --rm migrate
#   docker compose up -d
#
# Секреты и настройки — .env.production (другой файл: ENV_FILE=...). Обязателен
# WG_SECRETS_KEY (openssl rand -hex 32): им шифруются ключи WireGuard в БД.

name: wg-admin

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# Общее для api, worker и migrate: один образ, роль — APP_ROLE.
x-app: &app
  image: ${IMAGE:-ghcr.io/epifanovmd/wg-admin}:${TAG:-latest}
  env_file: ${ENV_FILE:-.env.production}
  environment: &app-env
    NODE_ENV: production
    SERVER_HOST: 0.0.0.0
    TRUST_PROXY: "true"
    POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
    REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    # Схему применяет только сервис migrate.
    DB_MIGRATIONS_RUN: "false"
    # Куча V8 — ниже лимита памяти контейнера, иначе OOM-kill вместо GC.
    NODE_OPTIONS: --enable-source-maps --max-old-space-size=512
  # Сервисы хоста (общий Postgres, опубликованный на порту хоста).
  extra_hosts:
    - host.docker.internal:host-gateway
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  logging: *logging

x-ready-check: &ready-check
  test:
    [
      "CMD",
      "node",
      "-e",
      "fetch('http://127.0.0.1:8181/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
    ]
  interval: 10s
  timeout: 5s
  retries: 6
  start_period: 60s

x-after-migrate: &after-migrate
  migrate:
    condition: service_completed_successfully
  redis:
    condition: service_healthy

services:
  # Одноразовый: применяет миграции и выходит. api и worker ждут его успеха.
  migrate:
    <<: *app
    command:
      [
        "node",
        "node_modules/typeorm/cli.js",
        "migration:run",
        "-d",
        "build/data-source.js",
      ]
    restart: "no"

  # HTTP, сокеты и протокол агентов нод.
  api:
    <<: *app
    build:
      context: .
      target: app
      # Версия сборки — из make (git describe, коммит, время сборки).
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        APP_COMMIT: ${APP_COMMIT:-}
        APP_BUILT_AT: ${APP_BUILT_AT:-}
    environment:
      <<: *app-env
      APP_ROLE: api
    # Несколько реплик: `docker compose up -d --scale api=3` и диапазон
    # API_PORTS=8181-8183 (или без host-портов — за reverse proxy по имени `api`).
    ports:
      - "${API_PORTS:-8181}:8181"
    depends_on: *after-migrate
    # SIGTERM → drain + in-flight + закрытие БД (SHUTDOWN_TIMEOUT_MS=30s) — с запасом.
    stop_grace_period: 55s
    deploy:
      resources:
        limits:
          memory: 768m
    healthcheck: *ready-check
    restart: unless-stopped

  # Фоновые задачи: cron домена (истечение пиров, offline нод, агрегаты
  # статистики), установка агентов на VPS по SSH.
  worker:
    <<: *app
    environment:
      <<: *app-env
      APP_ROLE: worker
    depends_on: *after-migrate
    # Активные задачи дорабатывают до JOBS_SHUTDOWN_TIMEOUT_MS (20s).
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          memory: 768m
    healthcheck: *ready-check
    restart: unless-stopped

  # HTTPS перед API (по профилю `https`): Caddy с автоматическим сертификатом
  # для APP_DOMAIN. Агентам и вебу — https://APP_DOMAIN вместо http://IP:порт.
  caddy:
    profiles: ["https"]
    image: caddy:2-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  redis:
    image: redis:7-alpine
    command:
      [
        "redis-server",
        "--save",
        "",
        "--appendonly",
        "no",
        "--maxmemory",
        "128mb",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
