name: Deploy

# Запуск готового образа коммита из ghcr на хосте по SSH (make release): из CI
# после проверок main (образ собирает и подписывает CI) или вручную с тегом
# (коммит, уже собранный CI). На хосте ничего не собирается. Настройки — переменная репозитория DEPLOY_ENV (содержимое
# .env.deploy), ключ — секрет SSH_PRIVATE_KEY. Секреты приложения — секрет
# PRODUCTION_ENV (содержимое .env.production): кладётся на хост при каждом
# деплое; без него используется файл, уже лежащий на хосте (make env).
on:
  workflow_call:
    inputs:
      tag:
        description: Тег образа в ghcr (полный sha коммита)
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Тег образа в ghcr (полный sha коммита); пусто — текущий коммит
        type: string
        required: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    # Только с main: ручной запуск с другой ветки пропускается.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      # Полная история с тегами: версия сборки — git describe (make).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Настройки деплоя
        env:
          DEPLOY_ENV: ${{ vars.DEPLOY_ENV }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$DEPLOY_ENV" ] || [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error::Нужны переменная репозитория DEPLOY_ENV и секрет SSH_PRIVATE_KEY"
            exit 1
          fi
          # Веб-форма GitHub сохраняет значение с CRLF — \r ломает хост и пути.
          printf '%s\n' "$DEPLOY_ENV" | tr -d '\r' > .env.deploy

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # Связь с хостом бывает нестабильной: таймауты и повторы подключения.
      - name: SSH к хосту
        run: |
          host=$(sed -n 's/^SSH_HOST=//p' .env.deploy)
          printf 'Host *\n  ConnectTimeout 20\n  ConnectionAttempts 5\n  ServerAliveInterval 15\n  ServerAliveCountMax 8\n' >> ~/.ssh/config
          for i in 1 2 3 4 5; do
            keys=$(ssh-keyscan -T 15 "$host" 2>/dev/null) && [ -n "$keys" ] && break
            sleep 5
          done
          [ -n "$keys" ] || { echo "::error::Хост $host не отвечает"; exit 1; }
          echo "$keys" >> ~/.ssh/known_hosts

      - name: Compose-файлы на хост
        run: |
          for i in 1 2 3; do make compose && exit 0; sleep 10; done
          exit 1

      - name: Секреты приложения на хост
        env:
          PRODUCTION_ENV: ${{ secrets.PRODUCTION_ENV }}
        run: |
          if [ -z "$PRODUCTION_ENV" ]; then
            echo "PRODUCTION_ENV не задан — используется файл на хосте"
            exit 0
          fi
          env_file=$(sed -n 's/^ENV_FILE=//p' .env.deploy)
          env_file=${env_file:-.env.production}
          ( umask 077 && printf '%s\n' "$PRODUCTION_ENV" | tr -d '\r' > "$env_file" )
          make env

      - name: Образ, миграции, запуск
        run: make release TAG="${{ inputs.tag || github.sha }}"

      # latest — последний выложенный коммит (для make release без TAG).
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: latest — на выложенный коммит
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/wg-admin
          TAG: ${{ inputs.tag || github.sha }}
        run: docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE:$TAG"
