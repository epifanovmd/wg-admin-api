name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # main не отменяется: новый push не должен оборвать деплой посреди миграции.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile --ignore-scripts
      - run: yarn generate
      - name: Спецификация и маршруты закоммичены актуальными
        run: |
          changes=$(git status --porcelain -- src/routing)
          [ -z "$changes" ] || { echo "$changes"; git diff -- src/routing | head -50; exit 1; }
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn test
      - run: yarn build

  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Версии воркеров подняты, Go в Dockerfile-ах = toolchain go.mod
        run: ../scripts/check-agent-version.sh
      # Версия Go — toolchain из go.mod: сборки и образы — одним Go с
      # исправлениями стандартной библиотеки (новый патч — правка go.mod).
      - id: go
        run: echo "version=$(awk '$1 == "toolchain" { sub(/^go/, "", $2); print $2; exit }' go.mod)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache-dependency-path: agent/go.sum
      - name: go.mod и go.sum актуальны
        run: go mod tidy && git diff --exit-code -- go.mod go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: go vet (linux и darwin — у воркеров есть код под платформу)
        run: go vet ./... && GOOS=darwin go vet ./...
      - run: go test -race ./...
      - name: Сборка воркеров wg и socks (linux и darwin × amd64 и arm64)
        run: |
          for name in wg socks; do
            version=$(tr -d '[:space:]' < workers/$name/VERSION)
            for p in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
              CGO_ENABLED=0 GOOS=${p%-*} GOARCH=${p#*-} go build -trimpath \
                -ldflags "-s -w -X main.version=$version" -o /tmp/workers/$name-$version-$p ./workers/$name
            done
          done

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # shellcheck предустановлен в образе ubuntu-latest.
      - run: shellcheck scripts/*.sh scripts/db/*.sh test/smoke/*.sh agent/*.sh agent/workers/*/*.sh

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: development
      POSTGRES_HOST: localhost
      # Интеграционный тест задач (pg-boss, job_runs) — на этой же базе.
      TEST_DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      POSTGRES_DB: ci
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci
      JWT_SECRET_KEY: ci-secret-key-0123456789abcdef0123456789
      ADMIN_EMAIL: admin@ci.local
      ADMIN_PASSWORD: ci-admin-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile --ignore-scripts
      - name: Миграции применяются на чистую БД
        run: yarn migration:run
      - name: Сущности не расходятся со схемой (нет незакоммиченной миграции)
        run: |
          yarn migration:generate src/migrations/CiDrift && { echo "Схема сущностей отличается от миграций"; exit 1; } || true
          test -z "$(ls src/migrations | grep CiDrift)" || { echo "Схема сущностей отличается от миграций"; exit 1; }
      - name: Очередь задач на настоящем Postgres
        run: yarn test:file src/modules/jobs/jobs.integration.test.ts

  e2e:
    runs-on: ubuntu-latest
    needs: verify
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      mailpit:
        image: axllent/mailpit
        ports: ["1025:1025", "8025:8025"]
    env:
      E2E_POSTGRES_HOST: localhost
      E2E_POSTGRES_USER: postgres
      E2E_POSTGRES_PASSWORD: postgres
      E2E_POSTGRES_DB: wg_admin_e2e
      E2E_REDIS_URL: redis://localhost:6379/15
      E2E_SMTP_HOST: localhost
      E2E_SMTP_PORT: "1025"
      E2E_MAILPIT_URL: http://localhost:8025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile --ignore-scripts
      - name: Живое хранилище на настоящем Redis
        run: yarn test:file src/core/redis/live-store.test.ts
        env:
          TEST_REDIS_URL: redis://localhost:6379/14
      # Настоящий агент в e2e: воркеры проекта и сборки агента с GitHub (текущий и
      # прежний — для обновления); сами тесты в GitHub не ходят.
      - id: go
        run: echo "version=$(awk '$1 == "toolchain" { sub(/^go/, "", $2); print $2; exit }' agent/go.mod)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache-dependency-path: agent/go.sum
      - run: yarn agent:release
      - run: yarn agent:fetch && yarn agent:fetch 1.0.1
      - run: yarn test:e2e

  audit:
    runs-on: ubuntu-latest
    # yarn v1 audit не умеет игнор-листы: транзитивные high без фикса
    # (tsoa, typeorm CLI) краснили бы каждый PR. Отчёт видно в
    # логе, блокирует — Trivy по образу (только исправимые CRITICAL/HIGH).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      # Код выхода yarn audit — битовая маска уровней (2 low, 4 moderate, 8 high, 16 critical)
      # и не учитывает --level: падаем только на high и critical.
      - name: yarn audit (только production-зависимости, high и critical)
        run: |
          code=0
          yarn audit --level high --groups dependencies || code=$?
          if [ $((code & 24)) -ne 0 ]; then exit "$code"; fi

  # Образ: на push в main — с подписью воркеров wg и socks, проверка Trivy и отправка в
  # ghcr с тегом коммита; деплой берёт именно его. В pull request — сборка и проверка.
  docker:
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/wg-admin
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build-info
        run: |
          echo "commit=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "built-at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          push: false
          load: true
          tags: |
            wg-admin:ci
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            APP_VERSION=${{ steps.build-info.outputs.commit }}
            APP_COMMIT=${{ steps.build-info.outputs.commit }}
            APP_BUILT_AT=${{ steps.build-info.outputs.built-at }}
          # Подпись воркеров wg и socks (стадия agent-release): закрытый ключ — секрет
          # AGENT_SIGNING_KEY, в слои образа не попадает.
          secrets: |
            agent_signing_key=${{ secrets.AGENT_SIGNING_KEY }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
      - name: Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: wg-admin:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          vuln-type: os,library
      - name: Образ в ghcr
        if: env.PUBLISH == 'true'
        run: docker push "$IMAGE:${{ github.sha }}"

  # Деплой main на хост после всех проверок: готовый образ коммита из ghcr; без
  # настроек DEPLOY_ENV — пропуск.
  deploy:
    needs: [verify, agent, shellcheck, migrations, e2e, docker]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENV != ''
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      packages: write
    with:
      tag: ${{ github.sha }}
    secrets: inherit
