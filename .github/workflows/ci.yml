name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # main не отменяется: новый push не должен оборвать деплой посреди миграции.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile --ignore-scripts
      - run: yarn generate
      - name: Спецификация и маршруты закоммичены актуальными
        run: |
          changes=$(git status --porcelain -- src/routing)
          [ -z "$changes" ] || { echo "$changes"; git diff -- src/routing | head -50; exit 1; }
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn test
      - run: yarn build

  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: agent/VERSION поднята, Go в Dockerfile-ах = go.mod
        run: ../scripts/check-agent-version.sh
      # Ветка Go — из go.mod (1.26.0 → 1.26), патч — последний: исправления
      # стандартной библиотеки попадают в бинари без правки go.mod.
      - id: go
        run: echo "version=$(awk '$1 == "go" { split($2, v, "."); print v[1] "." v[2]; exit }' go.mod)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.go.outputs.version }}
          check-latest: true
          cache-dependency-path: agent/go.sum
      - name: go.mod и go.sum актуальны
        run: go mod tidy && git diff --exit-code -- go.mod go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - name: Сборка linux/amd64 и linux/arm64
        run: |
          version=$(cat VERSION)
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$version" -o /tmp/agent-$arch ./cmd/wg-admin-agent
          done

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # shellcheck предустановлен в образе ubuntu-latest.
      - run: shellcheck scripts/*.sh scripts/db/*.sh test/smoke/*.sh templates/*/*.sh

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: development
      POSTGRES_HOST: localhost
      # Интеграционный тест задач (pg-boss, job_runs) — на этой же базе.
      TEST_DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      POSTGRES_DB: ci
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci
      JWT_SECRET_KEY: ci-secret-key-0123456789abcdef0123456789
      ADMIN_EMAIL: admin@ci.local
      ADMIN_PASSWORD: ci-admin-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile --ignore-scripts
      - name: Миграции применяются на чистую БД
        run: yarn migration:run
      - name: Сущности не расходятся со схемой (нет незакоммиченной миграции)
        run: |
          yarn migration:generate src/migrations/CiDrift && { echo "Схема сущностей отличается от миграций"; exit 1; } || true
          test -z "$(ls src/migrations | grep CiDrift)" || { echo "Схема сущностей отличается от миграций"; exit 1; }
      - name: Очередь задач на настоящем Postgres
        run: yarn test:file src/modules/jobs/jobs.integration.test.ts

  e2e:
    runs-on: ubuntu-latest
    needs: verify
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      mailpit:
        image: axllent/mailpit
        ports: ["1025:1025", "8025:8025"]
    env:
      E2E_POSTGRES_HOST: localhost
      E2E_POSTGRES_USER: postgres
      E2E_POSTGRES_PASSWORD: postgres
      E2E_POSTGRES_DB: wg_admin_e2e
      E2E_REDIS_URL: redis://localhost:6379/15
      E2E_SMTP_HOST: localhost
      E2E_SMTP_PORT: "1025"
      E2E_MAILPIT_URL: http://localhost:8025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile --ignore-scripts
      - name: Живое хранилище на настоящем Redis
        run: yarn test:file src/core/redis/live-store.test.ts
        env:
          TEST_REDIS_URL: redis://localhost:6379/14
      - run: yarn test:e2e

  audit:
    runs-on: ubuntu-latest
    # yarn v1 audit не умеет игнор-листы: транзитивные high без фикса
    # (tsoa, typeorm CLI) краснили бы каждый PR. Отчёт видно в
    # логе, блокирует — Trivy по образу (только исправимые CRITICAL/HIGH).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - name: yarn audit (только production-зависимости)
        run: yarn audit --level high --groups dependencies

  docker:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          push: false
          load: true
          tags: wg-admin:ci
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
      - name: Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: wg-admin:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          vuln-type: os,library

  # Деплой main на хост после всех проверок; без настроек DEPLOY_ENV — пропуск.
  deploy:
    needs: [verify, agent, shellcheck, migrations, e2e, docker]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENV != ''
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
