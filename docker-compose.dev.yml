# Локальная инфраструктура для `yarn dev` и e2e: Postgres, Redis, Mailpit (SMTP).
#   yarn services:up      (= docker compose -f docker-compose.dev.yml up -d --wait)
#   yarn services:down
# Порты — не стандартные (5434, 6381, 1027/8027): стек работает рядом с другими
# Postgres/Redis на этой машине. Другие — POSTGRES_PORT, REDIS_PORT, SMTP_PORT,
# MAILPIT_UI_PORT в окружении (и те же порты в .env.development).
name: wg-admin-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wg_admin
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6381}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Тестовый SMTP: письма не уходят наружу, смотреть — http://localhost:8027
  mailpit:
    image: axllent/mailpit
    ports:
      - "127.0.0.1:${SMTP_PORT:-1027}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8027}:8025"

volumes:
  postgres:
